name: CI

# T-248 (F-947, ADR-019, ADR-032). Every PR and every push to main runs the project's own
# definition of "green" (`npm run check`: typecheck → lint → unit + live integration tests →
# feature registry → Next.js build), then the Cloudflare (vinext) build, then the Playwright suite.
# Deployments themselves are done by Cloudflare Workers Builds (previews for branches, production
# from main) — this workflow only proves the code is safe to deploy.
#
# Repository secrets (Settings → Secrets and variables → Actions): NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY. Without them (e.g. a fork PR) the live
# integration tests skip themselves and the E2E job is skipped with a notice.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Check (typecheck, lint, tests, features, builds)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm run check
        run: npm run check
      - name: Cloudflare Workers build (vinext)
        run: npm run build:vinext

  e2e:
    name: E2E (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Skip without Supabase secrets
        if: env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "::notice::SUPABASE_SERVICE_ROLE_KEY is not available to this run (fork PR or secret not set); E2E skipped."
      - uses: actions/checkout@v4
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm ci
      - if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npx playwright install --with-deps chromium
      - name: Playwright (builds and starts the app itself)
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure() && env.SUPABASE_SERVICE_ROLE_KEY != ''
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
