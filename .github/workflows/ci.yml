name: CI

# T-248 (F-947, ADR-019, ADR-032). Every PR and every push to main runs the project's own
# definition of "green" (`npm run check`: typecheck → lint → unit + live integration tests →
# feature registry → Next.js build), then the Cloudflare (vinext) build, then the Playwright suite,
# then deploys to the `modern-lms` Worker (production from main, preview versions for PRs). The
# deploy replaced Cloudflare Workers Builds (user decision 2026-10-02).
#
# T-251 / ADR-034: each job starts its own local Supabase stack (Supabase CLI + Docker) from
# supabase/config.toml and supabase/migrations, seeds it with scripts/seed.mjs, and tests against
# it. CI never touches the hosted project (sharing it took the free-tier database down) and needs
# no repository secrets, so fork PRs get the full run too.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # ADR-029: SCORM runs on a content origin distinct from the app (same server, other host name),
  # as in production; without it the player falls back to the single-frame sandbox and the E2E
  # package's ADL parent search finds no API.
  NEXT_PUBLIC_SCORM_CONTENT_ORIGIN: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: "1"
  SUPABASE_CLI_VERSION: 2.119.0
  # The local stack mirrors the hosted Google provider (T-165); CI never completes a Google sign-in.
  SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
  SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder

jobs:
  check:
    name: Check (typecheck, lint, tests, features, builds)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase, export its URL and keys, seed it
        run: |
          supabase start
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run seed
      - name: npm run check
        run: npm run check
      - name: Cloudflare Workers build (vinext)
        run: npm run build:vinext

  e2e:
    # The full suite (desktop + mobile, ~450 tests) is split into shards that run in parallel;
    # each shard has its own Supabase stack, builds the app and starts it.
    name: E2E (Playwright) ${{ matrix.shard }}/6
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase, export its URL and keys, seed it
        run: |
          supabase start
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run seed
      - name: Playwright (builds and starts the app itself)
        run: npx playwright test --shard=${{ matrix.shard }}/6
      - name: Print the page snapshot of each failed test
        if: failure()
        run: |
          find test-results -name error-context.md | sort | while read -r f; do
            echo "::group::$f"; sed -n '1,150p' "$f"; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    # T-248 / ADR-032: deploys the vinext build to the `modern-lms` Worker from here instead of
    # Cloudflare Workers Builds. Only after Check and every E2E shard pass. Pushes to main go to
    # production; same-repo PRs upload a preview version that takes no traffic (--no-promote).
    # Skipped until the CLOUDFLARE_* secrets exist, and on fork PRs (no secrets there).
    name: Deploy to Cloudflare (${{ github.event_name == 'push' && 'production' || 'preview' }})
    needs: [check, e2e]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Baked into the client bundle at build time: the hosted project, not CI's local stack.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.PROD_APP_URL }}
      NEXT_PUBLIC_SCORM_CONTENT_ORIGIN: ${{ vars.PROD_SCORM_CONTENT_ORIGIN }}
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice::Cloudflare deploy skipped: set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PROD_SUPABASE_URL and PROD_SUPABASE_ANON_KEY repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: Build (vinext)
        if: steps.gate.outputs.ready == 'true'
        run: npm run build:vinext
      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npm run ${{ github.event_name == 'push' && 'deploy:vinext' || 'deploy:vinext:preview' }}
